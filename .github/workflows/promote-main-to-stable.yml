---
name: Promote main to stable

# Two-branch model: `main` is the testing branch (publishes :stable-testing and
# :testing); `stable` is the production branch (publishes :stable). On push to
# `main`, daily schedule, or manual dispatch, the shared factory workflow opens
# (or refreshes) a squash promotion PR from `main` to `stable`; merging it
# publishes :stable.
#
# Reusable logic lives in projectbluefin/actions — this is a thin caller,
# matching the pattern in projectbluefin/bluefin, projectbluefin/bluefin-lts,
# and projectbluefin/finpilot.
# pull[bot] was considered and rejected: the factory reusable is auditable,
# org-maintained, and shared with the other image repos (see issues #235/#237).

on:
  push:
    branches:
      - main
  schedule:
    # Daily promotion refresh window.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  # unblock-promotion-checks needs write to approve the check runs GitHub holds
  # for a bot-authored pull request. The reusable's jobs each declare their own
  # permissions, so widening the ceiling does not hand actions: write to them.
  actions: write
  contents: write
  issues: write
  packages: read
  pull-requests: write
  statuses: write

concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main to stable
    # yamllint disable-line rule:line-length
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@cbf1ce09363db6a09bfaae16fde95c7b8c2874bf # v1
    with:
      variants: >-
        [{"image":"${{ github.event.repository.name }}"}]
      cosign_identity_regexp: >-
        ^https://github\.com/${{ github.repository }}/\.github/workflows/
      registry: ghcr.io/${{ github.repository_owner }}
      source_branch: main
      target_branch: stable
      # The gate job below verifies the current candidate's cosign signature
      # before a human merges the promotion PR.
      run_e2e: false
      use_merge_queue: false
      # The reusable renders the promotion PR body from `auto_merge`, not
      # `use_merge_queue`: `auto_merge` states how the PR is merged at all.
      # Set it false so the PR body matches manual human merge rather than
      # advertising the bluefin/dakota weekly auto-merge schedule.
      auto_merge: false
      # Enrolling without a merge queue runs `gh pr merge --auto` with no merge
      # method, and GitHub CLI refuses that without a TTY ("--merge, --rebase,
      # or --squash required when not running interactively"). In addition, a
      # merge performed as github-actions creates no downstream push workflow
      # runs (build-image.yml on stable and sync-stable-to-main.yml). Merging
      # by hand in the UI fires both.
      enqueue_promotion: false
      request_reviewer: false
    secrets: inherit

  # The reusable rebuilds the promotion branch by overlaying main's tree on
  # stable, then staging the paths git reports as deletions. Git reports a moved
  # file as a rename, so every path main moved survives on its old path and the
  # branch's tree stops matching main's. Repair it here, before a human merges
  # the PR: a commit carrying main's tree on top of stable, the shape the
  # reusable intends. Skipped when the tree already matches, so a correct branch
  # never loses its approvals to a no-op force-push.
  repair-promotion-branch:
    name: Make the promotion branch match main
    needs: [promote]
    if: needs.promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PROMOTION_BRANCH: auto/promote-main-to-stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Rebuild the branch when its tree has drifted from main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main stable
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Repair the branch the reusable built. A missing branch means there
          # was nothing to promote, so there is nothing to repair. Check before
          # fetching it: fetching a ref the remote lacks exits 128 under -e.
          # --exit-code returns 2 only for "no such ref"; any other failure
          # (auth, network) must still fail the job.
          status=0
          git ls-remote --exit-code --heads origin "${PROMOTION_BRANCH}" \
            >/dev/null || status=$?
          if [ "${status}" -eq 2 ]; then
            echo "::notice::No ${PROMOTION_BRANCH} to repair."
            exit 0
          elif [ "${status}" -ne 0 ]; then
            echo "::error::git ls-remote failed (exit ${status})" \
              "checking ${PROMOTION_BRANCH}."
            exit "${status}"
          fi
          git fetch origin "${PROMOTION_BRANCH}"

          head_tree=$(git rev-parse "origin/${PROMOTION_BRANCH}^{tree}")
          main_tree=$(git rev-parse "origin/main^{tree}")
          if [ "${head_tree}" = "${main_tree}" ]; then
            echo "::notice::${PROMOTION_BRANCH} already matches main."
            exit 0
          fi

          commit=$(git commit-tree "${main_tree}" -p origin/stable \
            -m "chore: promote main to stable")
          git push --force origin "${commit}:refs/heads/${PROMOTION_BRANCH}"
          echo "Rebuilt ${PROMOTION_BRANCH} from main's tree."

  # The reusable declares no workflow-level outputs, so the promotion PR is
  # found by its deterministic head/base pair: reusable-promote-squash derives
  # auto/promote-<source>-to-<target> from the branch-model inputs. A no-op run,
  # where main and stable already match, has no PR at all. Two jobs need the
  # number — the approver below and the gate — so look it up once.
  locate-promotion-pr:
    name: Locate the promotion PR
    needs: [promote, repair-promotion-branch]
    if: >-
      needs.promote.result == 'success' &&
      needs.repair-promotion-branch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.find.outputs.pr_number }}
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_BRANCH: auto/promote-main-to-stable
    steps:
      - name: Find the open promotion PR
        id: find
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base stable \
            --head "${PROMOTION_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          if [ -z "${PR_NUMBER}" ]; then
            echo "::notice::No open promotion PR."
          fi

  # GitHub holds every check run it creates for a bot-authored pull request in
  # `action_required` until someone approves it, so the promotion PR's own
  # validation reports nothing until then. Without the approval the checks
  # effectively never run — and GitHub throttles scheduled unblocking workflows
  # to hours — so this job approves them seconds after the branch is pushed. If
  # one is ever missed, approve it from the run's page.
  unblock-promotion-checks:
    name: Unblock the promotion PR's checks
    needs: [locate-promotion-pr]
    if: needs.locate-promotion-pr.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_BRANCH: auto/promote-main-to-stable
    steps:
      - name: Approve pending runs on the promotion branch
        shell: bash
        run: |
          set -euo pipefail

          # Trust boundary: only runs on the bot-owned promotion branch, from
          # the bot itself. Those branches carry only commits that already
          # passed their own PR checks.
          runs_filter=".workflow_runs[]"
          runs_filter+=" | select(.head_branch == \"${PROMOTION_BRANCH}\")"
          runs_filter+=" | select(.actor.login == \"github-actions[bot]\")"
          runs_filter+=" | .id"

          approved=0
          # Runs for a freshly pushed branch appear a few seconds after the
          # push, so retry briefly instead of reporting nothing to do.
          runs_url="repos/${{ github.repository }}/actions/runs"
          runs_url+="?status=action_required&per_page=100"
          for attempt in 1 2 3 4 5 6; do
            mapfile -t run_ids < <(
              gh api "${runs_url}" --jq "${runs_filter}"
            )

            if [ "${#run_ids[@]}" -gt 0 ]; then
              for run_id in "${run_ids[@]}"; do
                approve_url="repos/${{ github.repository }}"
                approve_url+="/actions/runs/${run_id}/approve"
                if gh api -X POST "${approve_url}" >/dev/null; then
                  echo "Approved run ${run_id}"
                  approved=$((approved + 1))
                else
                  echo "::warning::Could not approve run ${run_id}"
                fi
              done
              break
            fi

            if [ "${attempt}" -lt 6 ]; then
              sleep 15
            fi
          done

          if [ "${approved}" -eq 0 ]; then
            echo "::notice::No pending runs matched; approve any missed run" \
              "from its page in the Actions tab."
          fi

  # The reusable's own release gate sits behind `enqueue_promotion`, which is
  # off because a promotion PR without a merge queue is merged by hand. That
  # input is a master switch for both the gate and the enrollment job, so
  # turning enrollment off turned the gate off too. Run the same gate here, so
  # the promotion PR is still verified and labelled before a human merges it.
  gate:
    name: Release gate checks
    needs: [locate-promotion-pr]
    if: needs.locate-promotion-pr.outputs.pr_number != ''
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: projectbluefin/actions/.github/workflows/reusable-release-gate.yml@cbf1ce09363db6a09bfaae16fde95c7b8c2874bf # v1
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ needs.locate-promotion-pr.outputs.pr_number }}
      registry: ghcr.io/${{ github.repository_owner }}
      variants: >-
        [{"image":"${{ github.event.repository.name }}"}]
      cosign_identity_regexp: >-
        ^https://github\.com/${{ github.repository }}/\.github/workflows/
      target_tag: testing
      # head_sha and the e2e_* inputs are deliberately omitted: they feed only
      # the commit-bound E2E check, which run_e2e: false disables. Add them if
      # e2e is ever enabled for this image.
      run_e2e: false
    secrets: inherit
